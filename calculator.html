<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator </title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .calculator {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            width: 340px;
        }

        /* মেমোরি ইন্ডিকেটর (M) দেখানোর জন্য */
        .display-container {
            position: relative;
            margin-bottom: 20px;
        }

        #memory-indicator {
            position: absolute;
            left: 12px;
            top: 8px;
            color: #ff9f0a;
            font-size: 0.85rem;
            font-weight: bold;
            visibility: hidden; /* মেমোরিতে কিছু থাকলে এটি দৃশ্যমান হবে */
        }

        #display {
            width: 100%;
            height: 65px;
            background-color: #2d2d2d;
            border: none;
            outline: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 2.2rem;
            text-align: right;
            padding: 10px 15px;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 12px; /* একটু চারকোনা-গোল মিশ্রিত প্রফেশনাল লুক */
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #333333;
            color: #ffffff;
        }

        button:active {
            transform: scale(0.95);
        }

        /* মেমোরি এবং স্পেশাল বাটনগুলোর কালার */
        .memory-btn {
            background-color: #2c3e50;
            color: #00d2d3;
            font-size: 1rem;
        }

        .operator {
            background-color: #ff9f0a;
            color: white;
        }

        .clear-btn {
            background-color: #a5a5a5;
            color: black;
        }

        .equal {
            background-color: #ff9f0a;
            color: white;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display-container">
            <span id="memory-indicator">M</span>
            <input type="text" id="display" readonly placeholder="0">
        </div>
        
        <div class="buttons">
            <!-- মেমোরি এবং জিটি ফাংশন বাটন -->
            <button class="memory-btn" onclick="handleMRC()">MRC</button>
            <button class="memory-btn" onclick="handleMPlus()">M+</button>
            <button class="memory-btn" onclick="handleMMinus()">M-</button>
            <button class="memory-btn" onclick="handleGT()">GT</button>
            
            <button class="clear-btn" onclick="clearDisplay()">C</button>
            <button class="clear-btn" onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="calculatePercentage()">%</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('00')">00</button>
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const memoryIndicator = document.getElementById('memory-indicator');

        // মেমোরি ভেরিয়েবলসমূহ
        let memoryValue = 0;   // M এর মান জমা রাখার জন্য
        let grandTotal = 0;     // GT এর মান জমা রাখার জন্য
        let mrcClickCount = 0;  // MRC কতবার ক্লিক করা হলো তা গোনার জন্য

        function appendValue(val) {
            if (display.value === 'Error' || display.value === '0') {
                display.value = '';
            }
            display.value += val;
            mrcClickCount = 0; // অন্য বাটনে চাপ দিলে MRC কাউন্টার রিসেট হবে
        }

        function clearDisplay() {
            display.value = '';
            mrcClickCount = 0;
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
            mrcClickCount = 0;
        }

        // সাধারণ হিসাব (=)
        function calculate() {
            try {
                if (display.value !== '') {
                    // স্ক্রিনের গুণ এবং ভাগের চিহ্ন পরিবর্তন করে eval করা
                    let expression = display.value;
                    let result = eval(expression);
                    
                    display.value = result;
                    
                    // Grand Total (GT) এ যোগ করা
                    grandTotal += parseFloat(result); 
                    mrcClickCount = 0;
                }
            } catch (error) {
                display.value = 'Error';
            }
        }

        // পার্সেন্টেজ (%) লজিক ফিক্স
        function calculatePercentage() {
            try {
                if (display.value !== '') {
                    let currentValue = eval(display.value);
                    display.value = currentValue / 100;
                    mrcClickCount = 0;
                }
            } catch (error) {
                display.value = 'Error';
            }
        }

        // M+ ফাংশন
        function handleMPlus() {
            try {
                let currentValue = display.value !== '' ? eval(display.value) : 0;
                memoryValue += parseFloat(currentValue);
                updateMemoryIndicator();
                mrcClickCount = 0;
            } catch (error) {
                display.value = 'Error';
            }
        }

        // M- ফাংশন
        function handleMMinus() {
            try {
                let currentValue = display.value !== '' ? eval(display.value) : 0;
                memoryValue -= parseFloat(currentValue);
                updateMemoryIndicator();
                mrcClickCount = 0;
            } catch (error) {
                display.value = 'Error';
            }
        }

        // MRC ফাংশন (১ম ক্লিকে শো, ২য় ক্লিকে মেমোরি ক্লিয়ার)
        function handleMRC() {
            mrcClickCount++;
            if (mrcClickCount === 1) {
                // ১ম ক্লিক: মেমোরির মান স্ক্রিনে দেখাবে
                display.value = memoryValue;
            } else if (mrcClickCount === 2) {
                // পরপর ২য় ক্লিক: মেমোরি ক্লিয়ার
                memoryValue = 0;
                display.value = '0';
                updateMemoryIndicator();
                mrcClickCount = 0;
            }
        }

        // GT (Grand Total) ফাংশন
        function handleGT() {
            display.value = grandTotal;
            mrcClickCount = 0;
        }

        // স্ক্রিনে ছোট 'M' লেখাটি দেখানো বা লুকানোর জন্য
        function updateMemoryIndicator() {
            if (memoryValue !== 0) {
                memoryIndicator.style.visibility = 'visible';
            } else {
                memoryIndicator.style.visibility = 'hidden';
            }
        }
    </script>
</body>
</html>
