<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator  </title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
        }

        .calculator {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0px 15px 35px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 380px;
        }

        /* উপরের টপবার এবং হিস্ট্রি টগল বাটন */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-toggle-btn {
            background-color: #2d2d2d;
            color: #ff9f0a;
            border: 1px solid #ff9f0a;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .history-toggle-btn:hover {
            background-color: #ff9f0a;
            color: #1e1e1e;
        }

        /* ডিসপ্লে কন্টেইনার */
        .display-container {
            position: relative;
            margin-bottom: 20px;
        }

        #memory-indicator {
            position: absolute;
            left: 15px;
            top: 10px;
            color: #ff9f0a;
            font-size: 0.9rem;
            font-weight: bold;
            visibility: hidden;
        }

        #display {
            width: 100%;
            height: 80px;
            background-color: #2d2d2d;
            border: none;
            outline: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 500;
            text-align: right;
            padding: 15px;
        }

        /* বোতামের গ্রিড (মোবাইলের জন্য সম্পূর্ণ রেসপন্সিভ) */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 16px 5px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #333333;
            color: #ffffff;
            user-select: none;
        }

        button:active {
            transform: scale(0.93);
        }

        .memory-btn {
            background-color: #2c3e50;
            color: #00d2d3;
            font-size: 0.95rem;
        }

        .operator {
            background-color: #ff9f0a;
            color: white;
        }

        .clear-btn {
            background-color: #a5a5a5;
            color: black;
        }

        .equal {
            background-color: #ff9f0a;
            color: white;
        }

        /* হিস্ট্রি পপআপ (Modal) স্টাইল */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .history-panel {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.8);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d2d2d;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .history-title {
            color: #ff9f0a;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            color: #a5a5a5;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 5px;
        }

        .history-list {
            flex-grow: 1;
            overflow-y: auto;
            max-height: 300px;
            padding-right: 5px;
        }

        .history-item {
            background-color: #2d2d2d;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: right;
            cursor: pointer;
        }

        .history-expr {
            font-size: 0.9rem;
            color: #a5a5a5;
        }

        .history-res {
            font-size: 1.15rem;
            color: #ffffff;
            font-weight: bold;
            margin-top: 3px;
        }

        .clear-history-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 0.95rem;
            width: 100%;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="top-bar">
            <button class="history-toggle-btn" onclick="toggleHistory()">📜 History</button>
        </div>

        <div class="display-container">
            <span id="memory-indicator">M</span>
            <input type="text" id="display" readonly placeholder="0">
        </div>
        
        <div class="buttons">
            <button class="memory-btn" onclick="handleMRC()">MRC</button>
            <button class="memory-btn" onclick="handleMPlus()">M+</button>
            <button class="memory-btn" onclick="handleMMinus()">M-</button>
            <button class="memory-btn" onclick="handleGT()">GT</button>
            
            <button class="clear-btn" onclick="clearDisplay()">C</button>
            <button class="clear-btn" onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="calculatePercentage()">%</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('00')">00</button>
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <!-- হিস্ট্রি পপআপ মোডাল -->
    <div class="modal-overlay" id="history-modal" onclick="closeModalOnOuterClick(event)">
        <div class="history-panel">
            <div class="history-header">
                <span class="history-title">🕒 ইতিহাস (History)</span>
                <button class="close-btn" onclick="toggleHistory()">&times;</button>
            </div>
            <div class="history-list" id="history-list">
                <!-- হিসাবের ইতিহাস থাকবে -->
            </div>
            <button class="clear-history-btn" onclick="clearHistory()">হিস্ট্রি মুছুন</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const memoryIndicator = document.getElementById('memory-indicator');
        const historyList = document.getElementById('history-list');
        const historyModal = document.getElementById('history-modal');

        let memoryValue = 0;   
        let grandTotal = 0;     
        let mrcClickCount = 0;  
        let isEvaluated = false;

        function toggleHistory() {
            historyModal.classList.toggle('active');
        }

        function closeModalOnOuterClick(e) {
            if (e.target === historyModal) {
                toggleHistory();
            }
        }

        function appendValue(val) {
            if (isEvaluated && !isNaN(val)) {
                display.value = '';
                isEvaluated = false;
            } else if (isEvaluated) {
                isEvaluated = false;
            }

            if (display.value === 'Error' || display.value === '0') {
                display.value = '';
            }
            display.value += val;
            mrcClickCount = 0;
        }

        function clearDisplay() {
            display.value = '';
            mrcClickCount = 0;
            isEvaluated = false;
        }

        function deleteLast() {
            if (display.value === 'Error') {
                display.value = '';
            } else {
                display.value = display.value.slice(0, -1);
            }
            mrcClickCount = 0;
        }

        function safeEval(expr) {
            if (/[^0-9+\-*/.]/.test(expr)) return 'Error';
            try {
                const result = Function('"use strict"; return (' + expr + ')')();
                return isFinite(result) ? result : 'Error';
            } catch (e) {
                return 'Error';
            }
        }

        function calculate() {
            if (display.value === '' || display.value === 'Error') return;

            let expression = display.value;
            let result = safeEval(expression);

            if (result === 'Error') {
                display.value = 'Error';
            } else {
                result = Number(Math.round(result + 'e8') + 'e-8');
                addHistoryItem(expression, result);
                display.value = result;
                grandTotal += parseFloat(result); 
                isEvaluated = true;
            }
            mrcClickCount = 0;
        }

        function calculatePercentage() {
            if (display.value === '' || display.value === 'Error') return;

            let expression = display.value;
            let currentValue = safeEval(expression);

            if (currentValue !== 'Error') {
                let result = currentValue / 100;
                result = Number(Math.round(result + 'e8') + 'e-8');
                addHistoryItem(`${expression}%`, result);
                display.value = result;
                isEvaluated = true;
            } else {
                display.value = 'Error';
            }
            mrcClickCount = 0;
        }

        function addHistoryItem(expr, res) {
            const item = document.createElement('div');
            item.className = 'history-item';
            
            let cleanExpr = expr.replaceAll('*', '×').replaceAll('/', '÷');
            
            item.innerHTML = `
                <div class="history-expr">${cleanExpr}</div>
                <div class="history-res">= ${res}</div>
            `;

            item.onclick = function() {
                display.value = res;
                isEvaluated = true;
                toggleHistory();
            };

            historyList.prepend(item);
        }

        function clearHistory() {
            historyList.innerHTML = '';
        }

        function handleMPlus() {
            let currentValue = safeEval(display.value);
            if (currentValue !== 'Error' && !isNaN(currentValue)) {
                memoryValue += parseFloat(currentValue);
                updateMemoryIndicator();
            } else {
                display.value = 'Error';
            }
            mrcClickCount = 0;
        }

        function handleMMinus() {
            let currentValue = safeEval(display.value);
            if (currentValue !== 'Error' && !isNaN(currentValue)) {
                memoryValue -= parseFloat(currentValue);
                updateMemoryIndicator();
            } else {
                display.value = 'Error';
            }
            mrcClickCount = 0;
        }

        function handleMRC() {
            mrcClickCount++;
            if (mrcClickCount === 1) {
                display.value = memoryValue;
                isEvaluated = true;
            } else if (mrcClickCount >= 2) {
                memoryValue = 0;
                display.value = '';
                updateMemoryIndicator();
                mrcClickCount = 0;
            }
        }

        function handleGT() {
            display.value = grandTotal;
            isEvaluated = true;
            mrcClickCount = 0;
        }

        function updateMemoryIndicator() {
            if (memoryValue !== 0) {
                memoryIndicator.style.visibility = 'visible';
            } else {
                memoryIndicator.style.visibility = 'hidden';
            }
        }

        document.addEventListener('keydown', function(event) {
            const key = event.key;
            if (!isNaN(key)) appendValue(key);
            if (['+', '-', '*', '/'].includes(key)) appendValue(key);
            if (key === '.') appendValue('.');
            if (key === 'Enter' || key === '=') calculate();
            if (key === 'Backspace') deleteLast();
            if (key === 'Escape') clearDisplay();
            if (key === '%') calculatePercentage();
        });
    </script>
</body>
</html>
